paths:
# ------------ Comienzan endpoints de Users  ------------ #
  /api/users:
    get:
      summary: Obtener todos los usuarios
      tags:
        - Users
      responses:
        '200':
          description: Lista de usuarios obtenida correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersListResponse'

  /api/users/{uid}:
    get:
      summary: Obtener un usuario por ID
      tags:
        - Users
      parameters:
        - name: uid
          in: path
          required: true
          description: ID del usuario
          schema:
            type: string
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: ID de usuario no válido (formato incorrecto)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'     

    put:
      summary: Actualizar un usuario
      tags:
        - Users
      parameters:
        - name: uid
          in: path
          required: true
          description: ID del usuario
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Usuario actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: ID de usuario o cuerpo de solicitud no válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'        

    delete:
      summary: Eliminar un usuario
      tags:
        - Users
      parameters:
        - name: uid
          in: path
          required: true
          description: ID del usuario
          schema:
            type: string
      responses:
        '200':
          description: Usuario eliminado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleMessage'
        '400':
          description: ID de usuario no válido (formato incorrecto)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'         

# ------------ Comienzan endpoints de Pets  ------------ #
  /api/pets:
    get:
      summary: Obtener todas las mascotas
      tags:
        - Pets
      responses:
        '200':
          description: Lista de mascotas obtenida correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetsListResponse'
    post:
      summary: Crear una nueva mascota
      tags:
        - Pets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetCreateRequest'
      responses:
        '201':
          description: Mascota creada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetResponse'
        '400':
          description: Cuerpo de solicitud no válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/pets/withimage:
    post:
      summary: Crear una nueva mascota con imagen
      tags:
        - Pets
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Firulais
                specie:
                  type: string
                  example: dog
                birthDate:
                  type: string
                  format: date
                  example: 2020-01-01
                image:
                  type: string
                  format: binary   # <- esto hace que Swagger muestre un input de archivo
      responses:
        '201':
          description: Mascota creada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetResponse'
        '400':
          description: Datos incompletos o archivo faltante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'              
  /api/pets/{pid}:
    put:
      summary: Actualizar una mascota
      tags:
        - Pets
      parameters:
        - name: pid
          in: path
          required: true
          description: ID de la mascota
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetCreateRequest'
      responses:
        '200':
          description: Mascota actualizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetResponse'
        '400':
          description: ID de mascota o cuerpo de solicitud no válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Mascota no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'      
    delete:
      summary: Eliminar una mascota
      tags:
        - Pets
      parameters:
        - name: pid
          in: path
          required: true
          description: ID de la mascota
          schema:
            type: string
      responses:
        '200':
          description: Mascota eliminada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleMessage'
        '400':
          description: ID de mascota no válido (formato incorrecto)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Mascota no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse' 


# ------------ Comienzan endpoints de Seccions  ------------ #        

  /api/sessions/register:
    post:
      summary: Registrar un nuevo usuario
      tags:
        - Sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario registrado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Datos incompletos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: El usuario ya existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/sessions/login:
    post:
      summary: Iniciar sesión de usuario
      tags:
        - Sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login exitoso (se establece cookie con el token JWT)
          headers:
            Set-Cookie:
              description: Cookie de autenticación `coderCookie` con el token JWT
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Datos incompletos o contraseña incorrecta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/sessions/current:
    get:
      summary: Obtener el usuario autenticado a partir de la cookie
      tags:
        - Sessions
      security:
        - cookieAuth: []   # usamos el esquema de seguridad por cookie
      responses:
        '200':
          description: Usuario autenticado actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: No se encontró la cookie o token inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

# ------------ Comienzan endpoints de Adoptions  ------------ #  

  /api/adoptions:
    get:
      summary: Obtener todas las adopciones
      tags:
        - Adoptions
      responses:
        '200':
          description: Lista de adopciones obtenida correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdoptionsListResponse'

  /api/adoptions/{aid}:
    get:
      summary: Obtener una adopción por ID
      tags:
        - Adoptions
      parameters:
        - name: aid
          in: path
          required: true
          description: ID de la adopción
          schema:
            type: string
      responses:
        '200':
          description: Adopción encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdoptionResponse'
        '400':
          description: ID de adopción no válido (formato incorrecto)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Adopción no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/adoptions/{pid}:
    post:
      summary: Crear una adopción (usuario autenticado adopta una mascota)
      tags:
        - Adoptions
      security:
        - cookieAuth: []
      parameters:
        - name: pid
          in: path
          required: true
          description: ID de la mascota a adoptar
          schema:
            type: string
      responses:
        '201':
          description: Adopción creada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdoptionResponse'
        '400':
          description: Mascota ya adoptada o IDs no válidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Login requerido (no hay cookie o token inválido)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Token inválido/expirado o rol no permitido (admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        
        '404':
          description: Usuario o mascota no encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    